# Proposta de contrato v2. Ainda NÃO é lido pelo compositor.
schema_version = 2

[appearance]
style = "glass" # Direção visual proposta; não é um material já implementado.
background = "#101820"
foreground = "#edf2f7"
accent = "#64d8cb"
font = "Sans 10"
border_width = 2
corner_radius = 10

[windows]
layout = "floating"
focus = "click"
workspaces = 4

[animations]
enabled = true
open_ms = 180
close_ms = 140
workspace_ms = 220
curve = "ease-out-cubic"

[effects.blur]
enabled = true
radius = 12

[effects.shadow]
enabled = true
radius = 16
opacity = 0.20

[effects.transparency]
enabled = true
opacity = 0.96

[effects.tint]
enabled = true
color = "#64d8cb"
strength = 0.08

[effects.reflection]
enabled = true
strength = 0.15

[effects.refraction]
enabled = false
strength = 0.02

[accessibility]
reduced_motion = false
reduced_transparency = false
increased_contrast = false

[performance]
mode = "adaptive" # adaptive | fixed
# Adaptação poderá alterar apenas estes efeitos, sem sobrescrever preferências.
adaptive_effects = ["blur", "shadow", "reflection", "refraction"]
allow_animation_reduction = false
allow_output_changes = false
frame_budget_fraction = 0.80
recovery_seconds = 10

[bindings]
terminal = "Super+Return"
close_window = "Super+q"
exit_session = "Super+Escape"
