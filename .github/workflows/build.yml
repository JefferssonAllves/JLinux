name: Build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc meson ninja-build pkg-config libgtk-3-dev libgtk-layer-shell-dev
      - run: meson setup build --buildtype=release
      - run: meson compile -C build
      - run: DESTDIR="$PWD/staging" meson install -C build
